name: cocktails
description: Personal cocktail recipe and inventory app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # The document picker, the share sheet's other half (ADR 18). By caret: a
  # finished plugin surface published by flutter.dev is stable, not dormant.
  file_selector: ^1.1.0
  flutter_riverpod: ^2.6.1
  # By caret, unlike the one below: this one still releases, so keeping up is
  # the cheaper reading of its risk (ADR 14).
  font_awesome_flutter: ^11.0.0
  path_provider: ^2.1.6
  # Pinned exactly: dormant since 0.3.8, so a release would want reviewing
  # rather than resolving into the build (ADR 13).
  scrollable_positioned_list: 0.3.8
  # The share sheet, and the FileProvider it ships with it (ADR 18). By caret,
  # under the same rule as the one above — it released a fortnight before it
  # was taken.
  share_plus: ^13.3.0
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
