# versionName+versionCode, read by android/app/build.gradle.kts; the code only climbs.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # DNS-SD, confined to lan_discovery.dart (ADR 13, ADR 27).
