name: cocktails
description: Personal cocktail recipe and inventory app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  # By caret, unlike the one below: this one still releases, so keeping up is
  # the cheaper reading of its risk (ADR 14).
  font_awesome_flutter: ^11.0.0
  path_provider: ^2.1.6
  # Pinned exactly: dormant since 0.3.8, so a release would want reviewing
  # rather than resolving into the build (ADR 13).
  scrollable_positioned_list: 0.3.8
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
