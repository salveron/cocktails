name: CI

on: push

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: a moving runner default would fail the build. Same major as gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      # Throwaway key: the release build refuses to run without one.
      - run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -alias ci \
            -storepass ci-throwaway -keypass ci-throwaway \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=CI, O=cocktails"
          printf 'storeFile=%s\nstorePassword=ci-throwaway\nkeyAlias=ci\nkeyPassword=ci-throwaway\n' \
            "$RUNNER_TEMP/ci.jks" > android/key.properties
      # Release, not debug: R8 runs only here, so a plugin its shrinking breaks fails on push.
      - run: flutter build apk --release
